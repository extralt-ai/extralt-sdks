name: Release

# release-please keeps one release PR per package open. Merging it tags the release, and the
# package is then built without credentials and published by Trusted Publishing once the
# environment's reviewer approves.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PRs and tags
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.release.outputs['python--release_created'] }}
      typescript: ${{ steps.release.outputs['typescript--release_created'] }}
    steps:
      # The App's token, unlike GITHUB_TOKEN, lets CI run on the release PRs.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}

  build-python:
    name: Build Python
    needs: release-please
    if: needs.release-please.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv build
        working-directory: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish-python:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/extralt/
    permissions:
      id-token: write # Trusted Publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - run: uv publish

  build-typescript:
    name: Build TypeScript
    needs: release-please
    if: needs.release-please.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      # npm pack does not create its destination.
      - run: mkdir npm-dist && npm pack --pack-destination npm-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-dist
          path: typescript/npm-dist/
          if-no-files-found: error

  publish-typescript:
    name: Publish to npm
    needs: build-typescript
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/extralt
    permissions:
      id-token: write # Trusted Publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-dist
          path: npm-dist/
      # Node 24 ships npm 11, which publishes through Trusted Publishing with provenance.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Without the leading ./, npm reads the path as a GitHub repository.
      - run: npm publish ./npm-dist/*.tgz
